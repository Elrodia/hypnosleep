<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HypnoSleep — AI Hypnosis App for Sleep, Confidence &amp; Habits</title>
    <meta name="description" content="AI hypnosis app with personalized sessions to help you sleep better, build confidence and break habits. Free 7-day trial, no credit card." />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Favicons & app icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Canonical / social origin is injected at build time from
         VITE_SITE_ORIGIN so staging and local builds don't point crawlers
         at the production deployment. Defaults to the production origin
         via `.env.production` if not overridden. -->
    <link rel="canonical" href="%VITE_SITE_ORIGIN%/" />

    <!-- Open Graph / Twitter Card -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HypnoSleep — AI-crafted hypnosis, made for you" />
    <meta property="og:description" content="Personalised hypnosis sessions, written for the goal you describe, in about 30 seconds. 7-day free trial, no credit card." />
    <meta property="og:image" content="%VITE_SITE_ORIGIN%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="%VITE_SITE_ORIGIN%/" />
    <meta property="og:site_name" content="HypnoSleep" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HypnoSleep — AI-crafted hypnosis, made for you" />
    <meta name="twitter:description" content="Personalised hypnosis sessions, in 30 seconds. 7-day free trial." />
    <meta name="twitter:image" content="%VITE_SITE_ORIGIN%/og.png" />

    <!-- Fonts: preload the single weight used above the fold to protect LCP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&family=Crimson+Pro:wght@400;500;600&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&family=Crimson+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="/src/main.css" rel="stylesheet" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
