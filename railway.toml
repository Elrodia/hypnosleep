# Railway build & deploy configuration.
#
# Railway picks up this file at the repo root and uses the Dockerfile
# next to it to build a single image containing both the Vite SPA and
# the Express API. Attach Redis, PostgreSQL, MySQL and an S3-compatible
# bucket as Railway plugins / services and wire them via env vars
# (see apps/api/README.md for the full list).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Database migrations run in `preDeployCommand`, which Railway executes
# exactly once per deploy (regardless of replica count) before any
# replica is started. Template seeding and the server itself run from
# `startCommand` on every replica.
#
# History:
#   1. `releaseCommand` (PR #74 and earlier) was a no-op because that's
#      Heroku terminology — Railway silently ignores unknown keys, so
#      migrations never ran. This presented as `provider_error` at
#      OAuth callback time once `0003_oauth_transactions` landed,
#      because `beginOAuthState` writes to a table that didn't exist.
#   2. Earlier `preDeployCommand` attempts (PRs 73–79) appeared to
#      produce no log output, but the underlying cause was actually
#      `drizzle-kit migrate` hanging on interactive confirmation
#      because the drizzle configs had `strict: true`. The pre-deploy
#      container has no TTY, so the prompt was waiting on a stdin that
#      would never deliver a newline, and the hook eventually timed
#      out with no useful output. Both drizzle configs now set
#      `strict: false` so migrations run non-interactively.
#   3. PR #81 moved migrations into `startCommand` to work around (2),
#      but that ran `npm run db:migrate` on all 6 replicas in parallel.
#      The first replica to acquire the migration lock would proceed
#      while the others blocked; combined with the still-present
#      `strict: true` prompt, every replica hung before binding its
#      port, `/health` never answered, and Railway killed the deploy
#      after the 30-second healthcheck timeout.
#
# `bootstrap-migrations.ts` is idempotent — it backfills the
# `__drizzle_migrations` tracking table for migrations applied during
# the original out-of-band bootstrap so drizzle-kit doesn't re-run
# them. `db:migrate` then applies any new migrations. If either step
# fails the deploy aborts before any replica is booted, and Railway
# surfaces the full output in the pre-deploy logs.
#
# `preDeployCommand` MUST be wrapped in `/bin/sh -c "..."` for the same
# reason `startCommand` is (see PR #83): Railway runs the value in exec
# form, so a bare `cmd1 && cmd2` would pass `&&` and `cmd2` as
# positional arguments to `cmd1` instead of chaining them through a
# shell. That trap is why PR #84 alone wasn't enough to fix the
# "missing tables" deploy: the bootstrap step exited 0 (correctly
# no-oping on a fresh DB), Railway treated the pre-deploy as a
# success, and `npm run db:migrate` was silently dropped on the floor —
# leaving the schema empty and `/api/health/database` reporting every
# core table missing.
#
# Template seeding stays in `startCommand` and remains best-effort: a
# Gemini rate-limit must not block sign-in. It is safe to run on every
# replica because the seeder is idempotent.
#
# The seeder runs in the BACKGROUND (`&`, not `&&`) so the Express
# server can bind its port and answer `/health` immediately. An
# earlier revision chained the two with `&&`, which meant the server
# only launched after the seeder finished — and when Gemini was slow
# or rate-limited the seeder routinely exceeded the 30s healthcheck
# timeout below, so `/health` never answered and Railway killed the
# deploy at the HEALTHCHECK stage. Backgrounding is safe because the
# seeder is idempotent, only writes to the `templates` table, and is
# not required for any startup-critical endpoint:
#   * `/health` is a static liveness probe (see comment below).
#   * `/api/health/database` queries MySQL's `information_schema` for
#     the presence of core tables — those are created by the
#     `preDeployCommand` migrations above, not by the seeder, so the
#     endpoint reports `ok` regardless of whether seeding has finished.
# `exec` replaces the shell with the node process so the server is
# PID 1 (or as close as Railway's runtime allows) and receives signals
# directly; the backgrounded seeder is reparented and exits on its
# own once it has finished or hit a rate-limit.
preDeployCommand = "/bin/sh -c \"node --import tsx scripts/bootstrap-migrations.ts && npm run db:migrate\""
startCommand = "/bin/sh -c \"(node --import tsx scripts/seed-templates.ts || echo 'startup: seed failed, continuing') & exec node dist/server.js\""
# `/health` is registered before the rate limiter and before the Sentry
# error handler, so Railway's probes never get 429'd or accidentally
# captured as synthetic errors. The richer `/api/health` endpoint is
# still available for in-app checks.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
