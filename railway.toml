# Railway build & deploy configuration.
#
# Railway picks up this file at the repo root and uses the Dockerfile
# next to it to build a single image containing both the Vite SPA and
# the Express API. Attach Redis, PostgreSQL, MySQL and an S3-compatible
# bucket as Railway plugins / services and wire them via env vars
# (see apps/api/README.md for the full list).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations and template seeding are run as part of `startCommand`,
# NOT in a `preDeployCommand`. This was a hard-won lesson:
#
#   1. `releaseCommand` (PR <#74) was a no-op because that's Heroku
#      terminology — Railway silently ignores unknown keys, so
#      migrations never ran. This presented as `provider_error` at
#      OAuth callback time once `0003_oauth_transactions` landed,
#      because `beginOAuthState` writes to a table that didn't exist.
#   2. Switching to `preDeployCommand` (PRs 73–79) hit a Railway
#      platform behaviour where the pre-deploy hook produced ZERO
#      log output regardless of how the command was structured —
#      `set -e`, `2>&1`, `printf` markers, dropping `npx`, creating
#      a HOME for the app user, etc. all came back blank. That made
#      every failure undebuggable, and PR #80 ended up replacing the
#      command with a pure diagnostic, regressing #1 above.
#
# Running migrations in `startCommand` sidesteps the silent
# pre-deploy hook entirely: stdout/stderr from the running container
# is captured by Railway's normal runtime log pipeline, so any
# migration failure is immediately visible. If migrations fail the
# process exits non-zero before binding the port, `/health` never
# answers, the deploy fails the healthcheck, and Railway surfaces
# the full migration output in the deploy logs.
#
# `bootstrap-migrations.ts` is idempotent — it backfills the
# `__drizzle_migrations` tracking table for migrations applied
# during the original out-of-band bootstrap so drizzle-kit doesn't
# re-run them. `db:migrate` then applies any new migrations.
# Template seeding stays best-effort: a Gemini rate-limit must not
# block sign-in.
startCommand = "node --import tsx scripts/bootstrap-migrations.ts && npm run db:migrate && (node --import tsx scripts/seed-templates.ts || echo 'startup: seed failed, continuing') && exec node dist/server.js"
# `/health` is registered before the rate limiter and before the Sentry
# error handler, so Railway's probes never get 429'd or accidentally
# captured as synthetic errors. The richer `/api/health` endpoint is
# still available for in-app checks.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
